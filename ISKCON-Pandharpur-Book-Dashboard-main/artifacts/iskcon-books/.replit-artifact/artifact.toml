kind = "web"
previewPath = "/"
title = "Bhaktivedanta Book Stall | ISKCON Pandharpur"
description = "A full-screen, animated web dashboard for Bhaktivedanta Book Stall at ISKCON Pandharpur, with book inventory, sales, receipts, searchable history, stock, reports, and optional account access."
version = "1.0.0"
id = "artifacts/iskcon-books"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23130

[services.development]
run = "pnpm --filter @workspace/iskcon-books run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/iskcon-books", "run", "build" ]
serve = "static"
publicDir = "artifacts/iskcon-books/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23130"
BASE_PATH = "/"
